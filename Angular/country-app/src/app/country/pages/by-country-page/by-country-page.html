<!-- country-search-input -->
<country-search-input
  placeholder="Buscar por pais"
  (value)="query.set($event)"
/>

<!-- country-list-table   -->
<div class="my-3">
  @if (countryResource.error()){
    <h3> {{ countryResource.error() }}</h3>
  }
  @if(countryResource.hasValue()){
    <!-- country-list-table -->
    <country-list-table
      [countries]="countryResource.value()!"
    />
  }
</div>
